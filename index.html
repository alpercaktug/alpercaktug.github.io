<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetmen Arşivi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-color: #4f46e5; /* İndigo */
            --secondary-color: #818cf8;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --accent-orange: #f97316;
            --accent-green: #10b981;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --header-height: 80px;
            --subheader-height: 100px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding-top: calc(var(--header-height) + var(--subheader-height) + 20px);
        }

        /* --- Header ve Kontrol Paneli (Sabit) --- */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .header-top {
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* İstatistik Rozetleri */
        .stats-group {
            display: flex;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        .stat-item .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-light);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat-item .value {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-dark);
        }
        
        .stat-item .value.blue { color: var(--primary-color); }
        .stat-item .value.green { color: var(--accent-green); }

        /* Alt Kontrol Paneli */
        .controls-bar {
            height: var(--subheader-height);
            background-color: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .controls-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            width: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr; /* Arama kutusu daha geniş */
            gap: 15px;
        }

        /* Form Elemanları */
        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
            background-color: #fff;
            font-family: 'Inter', sans-serif;
            height: 42px;
        }

        input[type="file"] {
            padding: 8px;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* --- Ana İçerik --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        /* --- Kart Tasarımı --- */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 320px; /* Sabit yükseklik, içerik kaydırılır */
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--secondary-color);
        }

        .card-header {
            padding: 20px 24px 15px;
            background: #fff;
            border-bottom: 1px solid #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .card h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-dark);
            font-weight: 700;
            line-height: 1.3;
            /* Uzun isimleri ... ile kes */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .badge {
            background-color: #f1f5f9;
            color: var(--text-light);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            margin-left: 10px;
            height: fit-content;
        }

        .badge.high-count {
            background-color: #fff7ed;
            color: var(--accent-orange);
            border: 1px solid #ffedd5;
        }

        .movies-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 24px;
            background: #fff;
        }

        .movies-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .movies-list li {
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
            line-height: 1.5;
        }
        .movies-list li:last-child { border-bottom: none; }

        .card-footer {
            background-color: #f8fafc;
            padding: 12px 24px;
            text-align: right;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .btn-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-link:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000;
            transition: opacity 0.3s;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e2e8f0; border-top: 4px solid var(--primary-color);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        .loading-text { font-weight: 600; color: var(--text-light); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mobil */
        @media (max-width: 900px) {
            body { padding-top: 260px; }
            .header-top { flex-direction: column; height: auto; padding: 15px; gap: 15px; }
            .controls-bar { height: auto; padding: 15px 0; }
            .controls-wrapper { grid-template-columns: 1fr; gap: 10px; }
            .stats-group { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Veriler Yükleniyor...</div>
</div>

<header class="fixed-header">
    <div class="header-top">
        <div class="brand">
            <h1>🎬 Yönetmen Arşivi</h1>
        </div>
        
        <div class="stats-group">
            <div class="stat-item">
                <span class="label">Yönetmen</span>
                <span class="value blue" id="statsDirectorCount">-</span>
            </div>
            <div class="stat-item">
                <span class="label">Toplam Film</span>
                <span class="value green" id="statsMovieCount">-</span>
            </div>
        </div>
    </div>

    <div class="controls-bar">
        <div class="controls-wrapper">
            <div>
                <input type="text" id="searchInput" placeholder="Yönetmen adı, film adı ara...">
            </div>
            
            <div>
                <select id="sortFilter">
                    <option value="count-desc" selected>Film Sayısı (Çok &rarr; Az)</option>
                    <option value="count-asc">Film Sayısı (Az &rarr; Çok)</option>
                    <option value="az">İsim (A-Z)</option>
                    <option value="za">İsim (Z-A)</option>
                </select>
            </div>
            
            <div>
                <select id="letterFilter">
                    <option value="all">Tüm Harfler</option>
                </select>
            </div>

            <div>
                 <input type="file" id="jsonFile" accept=".json" title="Farklı bir dosya yüklemek için tıklayın">
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div id="resultsGrid" class="grid">
        </div>
</div>

<script>
    // --- AYARLAR ---
    // Otomatik yüklenecek dosya adı. 
    // Bu dosyanın index.html ile AYNI klasörde olması gerekir.
    const DEFAULT_JSON_FILE = 'yonetmenler_v6_tum_harfler.json';

    // Global Değişkenler
    let allDirectors = [];
    let debounceTimer = null;

    // DOM Elementleri
    const resultsGrid = document.getElementById('resultsGrid');
    const searchInput = document.getElementById('searchInput');
    const letterFilter = document.getElementById('letterFilter');
    const sortFilter = document.getElementById('sortFilter');
    const statsDirectorCount = document.getElementById('statsDirectorCount');
    const statsMovieCount = document.getElementById('statsMovieCount');
    const fileInput = document.getElementById('jsonFile');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    // Yükleniyor Göstergesi
    const toggleLoading = (show, message = "Veriler Yükleniyor...") => {
        loadingText.textContent = message;
        loadingOverlay.style.opacity = show ? '1' : '0';
        loadingOverlay.style.pointerEvents = show ? 'all' : 'none';
    };

    // 1. SAYFA YÜKLENDİĞİNDE: Otomatik Fetch
    window.addEventListener('DOMContentLoaded', () => {
        loadDefaultData();
    });

    function loadDefaultData() {
        toggleLoading(true, "Arşiv Yükleniyor...");
        
        fetch(DEFAULT_JSON_FILE)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP Hata: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                processData(data);
                toggleLoading(false);
            })
            .catch(err => {
                console.error("Otomatik yükleme hatası:", err);
                toggleLoading(false);
                // Eğer otomatik dosya bulunamazsa istatistikleri sıfırla ve uyarı ver
                statsDirectorCount.textContent = "0";
                statsMovieCount.textContent = "0";
                resultsGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align:center; padding: 40px; background:white; border-radius:8px; border:1px solid #eee;">
                        <h3 style="color:#e11d48;">Veri Dosyası Bulunamadı</h3>
                        <p><b>${DEFAULT_JSON_FILE}</b> dosyası sunucuda veya klasörde bulunamadı.</p>
                        <p>Lütfen yukarıdaki <b>"Dosya Seç"</b> butonunu kullanarak JSON dosyanızı manuel yükleyin.</p>
                    </div>
                `;
            });
    }

    // 2. MANUEL DOSYA YÜKLEME (Override)
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        toggleLoading(true, "Dosya Okunuyor...");
        
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                processData(data);
                toggleLoading(false);
                // Input'u temizle ki aynı dosyayı tekrar seçebilsin
                fileInput.value = ''; 
            } catch (err) {
                alert("Hatalı veya bozuk JSON dosyası!");
                toggleLoading(false);
            }
        };
        reader.readAsText(file);
    });

    // 3. VERİYİ İŞLEME
    function processData(data) {
        allDirectors = [];
        
        // Dropdown'ı temizle
        letterFilter.innerHTML = '<option value="all">Tüm Harfler</option>';

        if (data.harfler && Array.isArray(data.harfler)) {
            data.harfler.forEach(group => {
                // Harf dropdown seçeneği
                const opt = document.createElement('option');
                opt.value = group.harf;
                opt.textContent = `${group.harf} (${group.toplam})`;
                letterFilter.appendChild(opt);

                // Yönetmenleri düz listeye ekle
                if (group.yonetmenler) {
                    group.yonetmenler.forEach(dir => {
                        allDirectors.push({
                            isim: dir.isim,
                            filmler: dir.filmler || [],
                            url: dir.url,
                            harfGrubu: group.harf,
                            // Sayıya çevir (veri string gelebilir)
                            film_sayisi: parseInt(dir.film_sayisi) || 0
                        });
                    });
                }
            });
        }
        
        // Veri yüklendiğinde ilk filtrelemeyi çalıştır
        filterData();
    }

    // 4. FİLTRELEME VE SIRALAMA
    function filterData() {
        // UI donmasını engellemek için kısa gecikme
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const selectedLetter = letterFilter.value;
            const sortValue = sortFilter.value;

            // --- Filtreleme ---
            let filtered = allDirectors.filter(dir => {
                // Harf Kontrolü
                const matchesLetter = (selectedLetter === 'all') || (dir.harfGrubu === selectedLetter);
                
                // Arama Kontrolü (İsimde veya Filmlerde)
                let matchesSearch = true;
                if (searchTerm) {
                    const inName = dir.isim.toLowerCase().includes(searchTerm);
                    const inMovies = dir.filmler.some(f => f.toLowerCase().includes(searchTerm));
                    matchesSearch = inName || inMovies;
                }

                return matchesLetter && matchesSearch;
            });

            // --- Sıralama ---
            filtered.sort((a, b) => {
                if (sortValue === 'az') return a.isim.localeCompare(b.isim, 'tr');
                if (sortValue === 'za') return b.isim.localeCompare(a.isim, 'tr');
                if (sortValue === 'count-desc') return b.film_sayisi - a.film_sayisi;
                if (sortValue === 'count-asc') return a.film_sayisi - b.film_sayisi;
            });

            renderDirectors(filtered);
        }, 150); // 150ms gecikme
    }

    // 5. EKRANA ÇİZME
    function renderDirectors(directors) {
        resultsGrid.innerHTML = '';
        
        // İstatistikleri güncelle
        statsDirectorCount.textContent = directors.length.toLocaleString('tr-TR');
        const totalMovies = directors.reduce((acc, curr) => acc + curr.film_sayisi, 0);
        statsMovieCount.textContent = totalMovies.toLocaleString('tr-TR');

        if (directors.length === 0) {
            resultsGrid.innerHTML = `
                <div style="grid-column: 1/-1; text-align:center; padding:50px; color:#94a3b8;">
                    <p style="font-size:1.2rem;">Sonuç bulunamadı.</p>
                </div>
            `;
            return;
        }

        const fragment = document.createDocumentFragment();

        directors.forEach(dir => {
            const card = document.createElement('div');
            card.className = 'card';

            // Filmleri HTML listesine çevir
            let moviesHtml = '';
            if (dir.filmler.length > 0) {
                moviesHtml = dir.filmler.map(f => `<li>${f}</li>`).join('');
            } else {
                moviesHtml = '<li style="font-style:italic; opacity:0.6">Film kaydı yok</li>';
            }

            // Rozet stili
            const isHighCount = dir.film_sayisi >= 5;
            const badgeClass = isHighCount ? 'badge high-count' : 'badge';

            card.innerHTML = `
                <div class="card-header">
                    <h2 title="${dir.isim}">${dir.isim}</h2>
                    <span class="${badgeClass}">${dir.film_sayisi} Film</span>
                </div>
                <div class="movies-container">
                    <ul class="movies-list">
                        ${moviesHtml}
                    </ul>
                </div>
                <div class="card-footer">
                    ${dir.url ? `<a href="${dir.url}" target="_blank" class="btn-link">Kamera Arkası Profili &rarr;</a>` : '<span style="color:#cbd5e1">Profil Yok</span>'}
                </div>
            `;
            fragment.appendChild(card);
        });

        resultsGrid.appendChild(fragment);
    }

    // Event Listeners
    searchInput.addEventListener('input', filterData);
    letterFilter.addEventListener('change', filterData);
    sortFilter.addEventListener('change', filterData);

</script>

</body>
</html>
